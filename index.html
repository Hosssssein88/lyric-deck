<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#100e22">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lyric Deck">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Lyric Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#100e22;--bg2:#17143a;--surface:#1c1940;--surface2:#272352;--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.16);
  --fg:#f3f0ff;--muted:#a49dcc;--dim:rgba(243,240,255,.28);--accent:#ff6b81;--accent-ink:#1a0610;
  --r:18px;--rs:11px;--pad:14px;--cover:none;--cover-s:none;--tb:1px solid var(--line);--tsh:none;--lyblur:1.2px;--lysize:28px;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --serif:"Fraunces",Georgia,serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;--lyfont:var(--display);
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
[data-theme=amoled]{--bg:#000;--bg2:#0a0a0e;--surface:#131318;--surface2:#1d1d24;--fg:#fff;--muted:#9a9aab}
[data-theme=dusk]{--bg:#1b0f1f;--bg2:#26142b;--surface:#2e1a35;--surface2:#3d2347;--fg:#fff0f5;--muted:#c7a3b8}
[data-theme=forest]{--bg:#0c1712;--bg2:#12231b;--surface:#162d22;--surface2:#20402f;--fg:#ecfaf0;--muted:#8fb8a0}
[data-theme=ocean]{--bg:#08141f;--bg2:#0d2133;--surface:#112a40;--surface2:#1a3a58;--fg:#eaf6ff;--muted:#8fb0cc}
[data-theme=paper]{--bg:#f4f5fb;--bg2:#e9ebf7;--surface:#fff;--surface2:#eef0fb;--line:rgba(20,20,70,.1);--line2:rgba(20,20,70,.18);--fg:#16142a;--muted:#66638a;--dim:rgba(22,20,42,.3);color-scheme:light}
[data-density=compact]{--pad:9px}
[data-font=grotesk]{--display:"Space Grotesk",system-ui,sans-serif}
[data-font=serif]{--display:"Fraunces",Georgia,serif}
[data-anim=off] *{animation:none!important;transition:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--body);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:22px;height:22px;flex:none}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.015em}
#app{height:100vh;height:100dvh;position:relative;display:grid;grid-template-columns:1fr;overflow:hidden}
.ambient{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.ambient::before{content:"";position:absolute;inset:0;background:var(--cover-s,none) center/cover;opacity:.55}
.ambient::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 0,var(--bg) 100%),radial-gradient(60% 40% at 80% 0,color-mix(in srgb,var(--accent) 16%,transparent),transparent)}
[data-bg=off] .ambient::before{display:none}
.nav{display:none}
.views{position:relative;z-index:1;overflow-y:auto;overflow-x:hidden;padding:calc(18px + var(--safe-t)) max(16px,env(safe-area-inset-left,0px)) calc(150px + var(--safe-b)) max(16px,env(safe-area-inset-right,0px))}
.view{display:none;max-width:760px;margin:0 auto}.view.on{display:block}
.vh{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.vh h1{font-size:30px;font-weight:800}
.sub{color:var(--muted);font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:var(--rs);font-weight:600;background:var(--surface2);border:1px solid var(--line)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn.block{width:100%}
.btn.done{background:#35d6a8!important;color:#04251c!important}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--fg)}
.iconbtn:hover{background:var(--line)}
.iconbtn.on{color:var(--accent)}
.field{width:100%;min-width:0;background:var(--surface);border:1.5px solid var(--line2);border-radius:var(--rs);padding:12px 14px;outline:none}
.field:focus{border-color:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:99px;border:1px solid var(--line2);color:var(--muted);font-weight:500;font-size:13px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.tools{display:flex;gap:10px;margin-bottom:6px}
.tools .field{flex:1}
select.field{flex:none;width:auto;padding-right:8px}
/* rows */
.list{display:grid;gap:2px}
.row{display:flex;align-items:center;gap:12px;padding:var(--pad) 8px;border-radius:var(--rs);cursor:pointer}
.row:hover{background:var(--line)}
.row.playing{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.thumb{width:48px;height:48px;border-radius:calc(var(--rs) - 2px);flex:none;background-size:cover;background-position:center;display:grid;place-items:center;color:#fff;position:relative;overflow:hidden}
.rt{flex:1;min-width:0}
.rt b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt span{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.playing .rt b{color:var(--accent)}
.lyb{color:var(--accent);display:grid}.lyb .ic{width:16px;height:16px}
.dur{font:400 12px var(--mono);color:var(--muted)}
.bars{position:absolute;inset:0;display:none;align-items:flex-end;justify-content:center;gap:3px;padding:12px;background:rgba(0,0,0,.5)}
.row.playing .bars{display:flex}
.bars i{width:4px;background:var(--accent);border-radius:2px;height:100%;transform:scaleY(.3);transform-origin:bottom;animation:bar .9s ease-in-out infinite}
.bars i:nth-child(2){animation-delay:.2s}.bars i:nth-child(3){animation-delay:.4s}
body:not(.is-playing) .bars i{animation-play-state:paused}
@keyframes bar{50%{transform:scaleY(.95)}}
.empty{border:1.5px dashed var(--line2);border-radius:var(--r);padding:36px 20px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.empty b{font:700 20px var(--display);color:var(--fg)}
body.drag .views::after{content:"Drop songs to add them";position:fixed;inset:12px;z-index:90;border:2px dashed var(--accent);border-radius:var(--r);background:color-mix(in srgb,var(--bg) 85%,transparent);display:grid;place-items:center;font:700 22px var(--display)}
/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;margin-bottom:12px}
.card h3{font-size:18px}
.mchips{display:flex;flex-wrap:wrap;gap:6px}
.mchip{font:500 11.5px var(--mono);padding:4px 9px;border-radius:99px;border:1px solid var(--line2);color:var(--muted)}
.mchip.ok{color:#35d6a8;border-color:color-mix(in srgb,#35d6a8 45%,transparent)}
.strip{background:var(--bg2);border-radius:var(--rs);padding:10px 12px;font:400 12.5px/1.7 var(--mono);overflow:hidden}
.strip div{display:flex;gap:10px;white-space:nowrap}.strip i{font-style:normal;color:var(--accent);flex:none}.strip span{overflow:hidden;text-overflow:ellipsis}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.fields2{grid-template-columns:1fr}}
.skel{height:150px;border-radius:var(--r);background:linear-gradient(100deg,var(--surface) 30%,var(--surface2) 50%,var(--surface) 70%);background-size:300% 100%;animation:sh 1.3s infinite}
@keyframes sh{to{background-position:0 0}from{background-position:100% 0}}
/* settings */
.sec{margin-bottom:22px}
.sec>h2{font-size:13px;font-family:var(--mono);font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin:0 4px 8px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.set{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 16px;border-top:1px solid var(--line)}
.set:first-child{border-top:0}
.set.col{flex-direction:column;align-items:stretch}
.set b{font-weight:500}.set small{display:block;color:var(--muted);font-size:12.5px}
.seg{display:inline-flex;background:var(--bg2);border-radius:var(--rs);padding:3px;gap:2px;flex:none;max-width:100%;overflow-x:auto}
.seg button{padding:7px 12px;border-radius:calc(var(--rs) - 3px);font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.sw{width:50px;height:30px;border-radius:99px;background:var(--surface2);border:1px solid var(--line2);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--fg);transition:transform .2s}
.sw[aria-checked=true]{background:var(--accent);border-color:transparent}
.sw[aria-checked=true]::after{transform:translateX(20px);background:var(--accent-ink)}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.theme{border-radius:var(--rs);border:2px solid var(--line2);padding:8px;display:grid;gap:6px;text-align:left;font-size:12px}
.theme.on{border-color:var(--accent)}
.theme i{display:block;height:34px;border-radius:7px;position:relative}
.theme i::after{content:"";position:absolute;left:6px;right:18px;bottom:6px;height:6px;border-radius:3px;background:var(--c)}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.swatch{width:34px;height:34px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 1.5px var(--line2)}
.swatch.on{border-color:var(--bg);box-shadow:0 0 0 2.5px var(--fg)}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;width:100%;height:28px;margin:0;min-width:0}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:5px;background:linear-gradient(90deg,var(--accent) var(--p,0%),var(--line2) var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--fg);margin-top:-6.5px;box-shadow:0 1px 6px rgba(0,0,0,.4)}
input[type=range]::-moz-range-track{height:5px;border-radius:5px;background:var(--line2)}
input[type=range]::-moz-range-progress{height:5px;border-radius:5px;background:var(--accent)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border:0;border-radius:50%;background:var(--fg)}
.rangerow{display:flex;align-items:center;gap:12px;min-width:140px;flex:1;max-width:260px}
.rangerow output{font:400 12px var(--mono);color:var(--muted);min-width:44px;text-align:right}
.eqrow{display:flex;justify-content:space-between;gap:6px}
.eqc{display:grid;justify-items:center;gap:6px;font:400 11px var(--mono);color:var(--muted)}
.eqc input{writing-mode:vertical-lr;direction:rtl;width:28px;height:120px}
.eqc input::-webkit-slider-runnable-track{background:var(--line2)}
/* now playing */
.now{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;background:var(--bg);transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.8,.2,1);padding:calc(8px + var(--safe-t)) max(18px,env(safe-area-inset-left,0px)) calc(14px + var(--safe-b)) max(18px,env(safe-area-inset-right,0px));overflow:hidden}
.now.open{transform:none}
.now>*{position:relative;z-index:1}.now>.ambient{position:absolute;z-index:0}
.ntop{display:flex;align-items:center;justify-content:space-between;gap:6px}
.ntabs{display:inline-flex;background:color-mix(in srgb,var(--bg2) 70%,transparent);border-radius:99px;padding:3px}
.ntabs button{padding:7px 14px;border-radius:99px;font-size:13px;font-weight:600;color:var(--muted)}
.ntabs button.on{background:var(--fg);color:var(--bg)}
.nid{display:flex;align-items:center;gap:12px;margin:8px 0}
.nid .t{flex:1;min-width:0}
.nid h2{font-size:21px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nid p{margin:0;color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pane{display:none;flex:1;min-height:0;flex-direction:column}.pane.on{display:flex}
.lytools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:4px 0 6px}
.lytools .btn{min-height:32px;padding:0 10px;font-size:12.5px;border-radius:99px}
.lyrics{flex:1;overflow-y:auto;position:relative;padding:36% 2px;-webkit-mask-image:linear-gradient(transparent,#000 14%,#000 86%,transparent);mask-image:linear-gradient(transparent,#000 14%,#000 86%,transparent);scrollbar-width:none;overscroll-behavior:contain}
.lyrics::-webkit-scrollbar{display:none}
.ly{font-family:var(--lyfont);font-size:var(--lysize);line-height:1.2;font-weight:700;margin:0 0 .6em;cursor:pointer;color:var(--fg);opacity:.22;transition:opacity .3s,transform .3s;transform-origin:left center;overflow-wrap:anywhere}
.ly[data-d="0"]{opacity:1}.ly[data-d="1"]{opacity:.6}.ly[data-d="2"]{opacity:.4}.ly[data-d="3"]{opacity:.28}
[data-lyblur=on] .ly[data-d="1"]{filter:blur(.5px)}[data-lyblur=on] .ly[data-d="2"]{filter:blur(1.2px)}
[data-lyalign=center] .ly{text-align:center;transform-origin:center}
[data-lystyle=glow] .ly.on{text-shadow:0 0 26px color-mix(in srgb,var(--accent) 65%,transparent);transform:scale(1.03)}
[data-lystyle=solid] .ly.on{color:var(--accent)}
[data-lystyle=karaoke] .ly.on{background:linear-gradient(90deg,var(--accent) var(--fill,0%),var(--fg) var(--fill,0%));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.ly.plain{opacity:.92!important;filter:none!important}
.lyempty{margin:auto;text-align:center;display:grid;gap:12px;justify-items:center;color:var(--muted);max-width:300px}
.lyempty b{font:700 20px var(--display);color:var(--fg)}
.artbox{flex:1;min-height:0;display:grid;place-items:center;gap:10px;align-content:center}
.discwrap{position:relative;width:min(80%,340px,40vh);aspect-ratio:1}
.art{position:absolute;inset:0;border-radius:var(--r);background:var(--cover) center/cover,linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 35%,#000));z-index:2;box-shadow:0 24px 50px -16px rgba(0,0,0,.7);transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.vinyl{position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle,#0d0d10 0 2px,#17171c 2px 4px);animation:spin 5s linear infinite;animation-play-state:paused;transform:translateX(0);transition:transform .6s}
.vinyl::after{content:"";position:absolute;inset:34%;border-radius:50%;background:var(--cover) center/cover,var(--accent);box-shadow:0 0 0 4px #0d0d10}
body.is-playing .vinyl{animation-play-state:running}
[data-cover=vinyl] .art{transform:translateX(-14%) scale(.82)}
[data-cover=vinyl] .vinyl{transform:translateX(16%)}
[data-cover=square] .vinyl{display:none}
@keyframes spin{to{rotate:360deg}}
#viz{width:100%;height:64px}
.qlist{flex:1;overflow-y:auto;min-height:0}
.seekrow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;font:400 12px var(--mono);color:var(--muted);margin-top:6px}
.ctrls{display:flex;align-items:center;justify-content:space-between;padding:2px 4px}
.ctrls .iconbtn{width:52px;height:52px}
.play{width:70px!important;height:70px!important;background:var(--accent);color:var(--accent-ink)!important;box-shadow:0 10px 30px -8px var(--accent)}
.play:hover{background:var(--accent)!important;filter:brightness(1.07)}
.play .ic{width:30px;height:30px}
.ctrls2{display:flex;align-items:center;justify-content:space-between;gap:4px}
.vol{display:none;align-items:center;gap:8px;width:140px}
.pill{font:500 12px var(--mono);padding:5px 10px;border-radius:99px;border:1px solid var(--line2);color:var(--muted)}
.noneplaying{margin:auto;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.noneplaying b{font:700 20px var(--display);color:var(--fg)}
.now.idle .nid,.now.idle .seekrow,.now.idle .ctrls,.now.idle .ctrls2,.now.idle .pane,.now.idle .ntabs{display:none}
.now:not(.idle) .noneplaying{display:none}
/* mini + tabbar */
.mini{position:fixed;z-index:20;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));bottom:calc(66px + var(--safe-b));display:flex;align-items:center;gap:12px;padding:8px 8px 8px 8px;border-radius:var(--r);background:var(--bg2);border:1px solid var(--line2);overflow:hidden;box-shadow:0 12px 30px -10px rgba(0,0,0,.6)}
.mini[hidden]{display:none}
.mini .thumb{width:44px;height:44px}
.mini .rt{cursor:pointer}
.mini .mp{position:absolute;left:0;bottom:0;height:2.5px;background:var(--accent);width:100%;transform:scaleX(0);transform-origin:left}
.tabbar{position:fixed;z-index:25;left:0;right:0;bottom:0;display:flex;padding:6px 8px calc(6px + var(--safe-b));background:var(--bg);border-top:1px solid var(--line)}
.tabbar button{flex:1;display:grid;justify-items:center;gap:2px;padding:6px;font-size:11px;font-weight:600;color:var(--muted)}
.tabbar button.on{color:var(--accent)}
/* sheet + toast */
.sheetwrap{position:fixed;inset:0;z-index:60;display:none}.sheetwrap.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);animation:fade .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;max-height:88dvh;display:flex;flex-direction:column;background:var(--bg2);border-radius:calc(var(--r) + 6px) calc(var(--r) + 6px) 0 0;border:1px solid var(--line2);padding:8px 16px calc(16px + var(--safe-b));animation:up .28s cubic-bezier(.2,.8,.2,1)}
.sheet::before{content:"";width:40px;height:4px;border-radius:4px;background:var(--line2);margin:0 auto 8px}
.sheet header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.sheet header h3{font-size:19px}
#sheetBody{overflow-y:auto;display:grid;gap:10px;align-content:start}
.menu{display:grid}
.menu button{display:flex;align-items:center;gap:14px;padding:13px 6px;border-radius:var(--rs);text-align:left;font-weight:500}
.menu button:hover{background:var(--line)}.menu button.danger{color:#ff6b6b}
.menu .ic{color:var(--muted)}
@keyframes up{from{transform:translateY(40px);opacity:0}}@keyframes fade{from{opacity:0}}
textarea.field{min-height:200px;font:400 13px/1.6 var(--mono);resize:vertical}
.toast{position:fixed;left:50%;bottom:calc(140px + var(--safe-b));transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:99px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:980px){
  #app{grid-template-columns:230px 1fr 440px}
  .nav{display:flex;flex-direction:column;gap:4px;padding:calc(22px + var(--safe-t)) 14px 20px;position:relative;z-index:1;border-right:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px;font:800 22px var(--display);margin:0 6px 22px;letter-spacing:-.02em}
  .brand i{width:36px;height:36px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
  .nav button{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:var(--rs);font-weight:600;color:var(--muted);text-align:left}
  .nav button:hover{background:var(--line)}.nav button.on{background:var(--surface2);color:var(--fg)}
  .nav button.on .ic{color:var(--accent)}
  .tabbar,.mini,.collapse{display:none!important}
  .views{padding-bottom:40px}
  .now{position:relative;transform:none;z-index:1;background:transparent;border-left:1px solid var(--line)}
  .now>.ambient{display:none}

function importData(){
  const i=document.createElement('input');i.type='file';i.accept='.json,application/json';
  i.onchange=async()=>{const f=i.files[0];if(!f)return;let d;
    try{d=JSON.parse((await f.text()).replace(/^﻿/,''))}catch(e){toast('That isn’t a valid backup file');return}
    if(!d||d.app!=='lyric-deck'){toast('That isn’t a Lyric Deck backup');return}
    const byK=new Map([...S.tracks.values()].map(t=>[tkey(t),t]));let hit=0,miss=0,pl=0;
    for(const x of d.tracks||[]){const t=byK.get(x.k);if(!t){miss++;continue}hit++;t.fav=t.fav||x.fav;t.plays=Math.max(t.plays||0,x.plays||0);t.listened=Math.max(t.listened||0,x.listened||0);t.skips=Math.max(t.skips||0,x.skips||0);t.lastPlayed=Math.max(t.lastPlayed||0,x.lastPlayed||0);if(x.lrc&&!t.lrc)t.lrc=x.lrc;if(x.offset&&!t.offset)t.offset=x.offset;await DB.put(t)}
    for(const p of d.playlists||[]){const ids=(p.items||[]).map(k=>byK.get(k)).filter(Boolean).map(t=>t.id);let g=S.pl.find(q=>q.name===p.name);if(!g){g={id:uid(),name:p.name,ids:[]};S.pl.push(g)}ids.forEach(id=>{if(!g.ids.includes(id))g.ids.push(id)});pl++}

    S.log.sort((a,b)=>a.ts-b.ts);if(S.log.length>3000)S.log.splice(0,S.log.length-3000);js('ld-log',S.log);

}

function ruleText(){return SET.playRule==='half'?'half of it':SET.playRule+' seconds'}
function renderTop(){
  const o=$('#topOut');if(!o)return;const all=[...S.tracks.values()],now=Date.now();
  $$('#topSeg button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.period));
  const m=new Map();
  if(S.period==='all')all.forEach(t=>t.plays&&m.set(t.id,t.plays));
  else{const span=(S.period==='week'?7:30)*864e5;S.log.forEach(e=>{if(now-e.ts<=span&&S.tracks.has(e.id))m.set(e.id,(m.get(e.id)||0)+1)})}
  const rank=[...m.entries()].sort((a,b)=>b[1]-a[1]).map(([id,c])=>[S.tracks.get(id),c]);
  const total=rank.reduce((a,x)=>a+x[1],0),mins=Math.round(all.reduce((a,t)=>a+(t.listened||0),0)/60);
  $('#topSub').textContent=`A play counts after ${ruleText()}`;
  if(!rank.length){o.innerHTML=`<div class="empty">${ic('chart')}<b>No plays counted yet</b><span>A song counts after you listen to ${ruleText()}. Songs you skip never count.</span></div>`;return}
  const art=new Map();rank.forEach(([t,c])=>{if(t.artist)art.set(t.artist,(art.get(t.artist)||0)+c)});
  const arts=[...art.entries()].sort((a,b)=>b[1]-a[1]).slice(0,6);
  const recent=all.filter(t=>t.lastPlayed).sort((a,b)=>b.lastPlayed-a.lastPlayed).slice(0,8);
  const secs=Math.round(all.reduce((a,t)=>a+(t.listened||0),0)),dur=secs<60?secs+'s':mins>=60?Math.floor(mins/60)+'h '+(mins%60)+'m':mins+'m';
  o.innerHTML=`<div class="tiles"><div class="tile"><b>${total}</b><span>plays</span></div><div class="tile"><b>${rank.length}</b><span>songs</span></div><div class="tile"><b>${dur}</b><span>listened, all time</span></div></div>
  <div class="sech">Most played</div><div class="list" id="topList">${rank.slice(0,30).map(([t,c],i)=>rowHtml(t,`<span class="pcount">${c} play${c>1?'s':''}</span>`).replace('<div class="thumb"',`<span class="rank">${i+1}</span><div class="thumb"`)).join('')}</div>
  ${arts.length?`<div class="sech">Top artists</div><div class="mchips">${arts.map(([a,c])=>`<span class="mchip">${esc(a)} · ${c}</span>`).join('')}</div>`:''}
  ${recent.length?`<div class="sech">Recently played</div><div class="list" id="recList">${recent.map(t=>rowHtml(t,'')).join('')}</div>`:''}`;
}

audio.addEventListener('play',()=>{keepAlive();LST.last=audio.currentTime;posState(true);ctrlIcons();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);wake(true);if('mediaSession' in navigator)navigator.mediaSession.playbackState='playing'});
audio.addEventListener('pause',()=>{const ct=cur();if(ct&&LST.sec>0)flush(ct);ctrlIcons();cancelAnimationFrame(raf);progress();wake(false);if('mediaSession' in navigator)navigator.mediaSession.playbackState='paused'});
audio.addEventListener('timeupdate',()=>{listenTick();posState();if(audio.paused)progress();const n=Date.now();if(n-S.saveT>3000&&cur()){S.saveT=n;js('ld-last',{id:S.curId,t:audio.currentTime})}});
audio.addEventListener('seeked',()=>{LST.last=audio.currentTime;progress();posState(true)});audio.addEventListener('loadedmetadata',()=>{const t=cur();if(t&&isFinite(audio.duration)&&Math.abs(audio.duration-t.dur)>1){t.dur=audio.duration;putSoon(t)}progress()});
audio.addEventListener('error',()=>{if(cur())toast('Can’t play this file')});
audio.addEventListener('ended',()=>{listenTick();
  if(S.sleepEnd){S.sleepEnd=false;$('#bSleep').classList.remove('on');return}
  if(S.repeat==='one'){listenReset(true);audio.currentTime=0;audio.play();return}next(true)});
setInterval(()=>{if(S.sleepAt&&Date.now()>=S.sleepAt){S.sleepAt=0;$('#bSleep').classList.remove('on');audio.pause();toast('Sleep timer: paused')}},1000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!audio.paused)wake(true);if(ctx&&ctx.state==='suspended'&&!audio.paused)ctx.resume()});
document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  if(e.key===' '){e.preventDefault();toggle()}else if(e.key==='ArrowRight')audio.currentTime+=5;else if(e.key==='ArrowLeft')audio.currentTime-=5;
  else if(e.key==='ArrowUp'){SET.volume=Math.min(1,SET.volume+.05);applyAudio()}else if(e.key==='ArrowDown'){SET.volume=Math.max(0,SET.volume-.05);applyAudio()}
  else if(e.key==='n')next(false);else if(e.key==='p')prev();else if(e.key==='Escape'){closeSheet();closeNow()}});
let dc=0;addEventListener('dragenter',e=>{e.preventDefault();dc++;document.body.classList.add('drag')});addEventListener('dragleave',()=>{if(--dc<=0){dc=0;document.body.classList.remove('drag')}});
addEventListener('dragover',e=>e.preventDefault());addEventListener('drop',e=>{e.preventDefault();dc=0;document.body.classList.remove('drag');if(e.dataTransfer.files.length)addFiles(e.dataTransfer.files)});
/* ---------- init ---------- */
addEventListener('beforeinstallprompt',e=>{e.preventDefault();S.installEv=e;renderSettings()});
addEventListener('appinstalled',()=>{S.installEv=null;renderSettings();toast('Installed')});
addEventListener('resize',()=>wallSync());
$('#views').addEventListener('scroll',()=>{if(wallRaf||SET.wp==='none'||SET.wpMode==='still')return;wallRaf=requestAnimationFrame(()=>{wallRaf=0;wallSync()})},{passive:true});
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
(async()=>{
  const ok=await DB.open();if(!ok)setTimeout(()=>toast('Private mode: songs won’t be kept after closing'),800);
  const rows=await DB.all();
  for(const t of rows){if(t.file&&DB.db){await DB.putBlob(t.id,t.file);t.hasBlob=true;t.size=t.file.size;delete t.file;await DB.put(t)}else if(t.hasBlob&&!t.size&&!t.file){t.size=0}S.tracks.set(t.id,t)}
  try{const wb=await DB.getBlob('wp-custom');if(wb)S.wpUrl=URL.createObjectURL(wb)}catch(e){}
  for(const f of await DB.folders()){f.ok=false;try{f.ok=(await f.handle.queryPermission({mode:'read'}))==='granted'}catch(e){}S.folders.set(f.id,f)}
  keepAlive();applySettings();ctrlIcons();renderLibrary();applyAudio();tab(SET.npTab);setTimeout(thumbJob,1500);
  if(SET.coverAuto)setTimeout(()=>coversBulk(true),3500);
  setTimeout(()=>S.folders.forEach(f=>{if(f.ok)scanFolder(f,true)}),1200);
  const last=jl('ld-last',null);
  if(SET.resume&&last&&S.tracks.has(last.id)){S.queue=[...visible().map(t=>t.id)];S.orig=S.queue.slice();loadTrack(last.id,false,last.t)}
})();
})();
</script>
</body>
